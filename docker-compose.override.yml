# BUILDFLOW_PHASE9_MINIO
services:
  backend:
    environment:
      BUILDFLOW_DEMO_ENABLED: "true"
      BUILDFLOW_STORAGE_ENDPOINT: http://minio:9000
      BUILDFLOW_STORAGE_ACCESS_KEY: ${MINIO_ACCESS_KEY:-buildflow-local}
      BUILDFLOW_STORAGE_SECRET_KEY: ${MINIO_SECRET_KEY:-buildflow-local-secret}
      BUILDFLOW_STORAGE_BUCKET: ${MINIO_BUCKET:-buildflow}
    depends_on:
      minio:
        condition: service_started

  minio:
    image: minio/minio:latest
    command:
      - server
      - /data
      - --console-address
      - ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-buildflow-local}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-buildflow-local-secret}
    ports:
      - "127.0.0.1:${MINIO_API_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - buildflow_minio_data:/data

volumes:
  buildflow_minio_data:
