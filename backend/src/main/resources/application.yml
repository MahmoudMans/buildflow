spring:
  application:
    name: buildflow-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/buildflow}
    username: ${DB_USERNAME:buildflow}
    password: ${DB_PASSWORD:buildflow_dev_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

app:
  security:
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    email-verification-ttl: 24h
    password-reset-ttl: 30m
    invitation-ttl: 7d
    cookie-secure: false
    frontend-url: ${FRONTEND_URL:http://localhost:3000}

logging:
  level:
    root: INFO
    com.buildflow: INFO

  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level traceId=%X{traceId:-none} [%thread] %logger{36} - %msg%n"
