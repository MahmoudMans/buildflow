
# BUILDFLOW_PHASE13_SECURITY_HARDENING

buildflow.security.login-max-requests=${BUILDFLOW_LOGIN_RATE_LIMIT_MAX_REQUESTS:20}
buildflow.security.login-window-seconds=${BUILDFLOW_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
buildflow.security.max-request-body-bytes=${BUILDFLOW_MAX_REQUEST_BODY_BYTES:27262976}
buildflow.security.allowed-origin=${FRONTEND_URL:http://localhost:3001}

spring.servlet.multipart.max-file-size=${BUILDFLOW_MAX_UPLOAD_SIZE:25MB}
spring.servlet.multipart.max-request-size=${BUILDFLOW_MAX_REQUEST_SIZE:26MB}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${BUILDFLOW_SESSION_COOKIE_SECURE:false}
server.servlet.session.tracking-modes=COOKIE
